    status: 200
  - url: http://127.0.0.1:8081/rest/v1/coffee-inventory
    status: 401
  - url: http://127.0.0.1:8081/healthz
    status: 200
  - url: http://127.0.0.1:8081/
    status: 200
  - url: http://127.0.0.1:8081/css/style.css
    status: 200
  - url: http://127.0.0.1:8081/js/app.js
